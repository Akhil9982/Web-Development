<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Img_Lists_Tables</title>
  </head>
  <body>
    <img src="https://web.dev/static/images/home-blue_720.png" alt="image" />
    <ul>
      <li>This is a Unordered list 1</li>
      <li>This is a Unordered list 2</li>
      <li>This is a Unordered list 3</li>
    </ul>
    <ol>
      <li>This is an Ordered List 1</li>
      <li>This is an Ordered List 2</li>
      <li>This is an Ordered List 3</li>
    </ol>
    <table>
      <thead>
        <tr>
          <th>Header 1</th>
          <th>Header 2</th>
          <th>Header 3</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Data 1</td>
          <td>Data 2</td>
          <td>Data 3</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>

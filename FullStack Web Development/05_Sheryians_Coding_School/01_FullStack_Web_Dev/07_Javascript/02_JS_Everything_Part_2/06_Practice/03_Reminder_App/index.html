<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Stack UI</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script defer src="script.js"></script>
  </head>
  <body>
    <main>
      <div class="cards-stack">
      </div>
      <div class="navbtns">
        <button type="button" class="btn btn-dark" id="upbtn">
          <i class="fa-solid fa-angle-up"></i> Up
        </button>
        <button type="button" class="btn btn-dark" id="downbtn">
          <i class="fa-solid fa-angle-down"></i> Down
        </button>
        <button type="button" class="btn btn-primary" id="add-card-btn">
          <i class="fa-solid fa-plus"></i> Add Card
        </button>
      </div>
      <div class="form-section hidden">
        <h1>Add New Record</h1>
        <form>
          <div class="category">
            <p>Category :</p>
            <!-- Radio -->
            <input type="radio" name="type" id="reminder" value="reminder" />
            <label for="reminder">Reminder</label>
            <input type="radio" name="type" id="call" value="call" />
            <label for="call">Call</label>
          </div>

          <!-- Title -->
          <h3>Title</h3>
          <input
            required
            type="text"
            name="title"
            id="titleinp"
            placeholder="Enter title..."
          />
          <!-- Date Time -->
          <h3>Date & Time</h3>
          <input
            required
            type="datetime-local"
            name="datetime"
            id="date_time_inp"
          />
          <!-- Buttons -->
          <div class="form-btn">
            <button class="btn btn-dark" type="button" id="cancel-btn">
              Cancel
            </button>
            <button class="btn btn-primary" type="submit" id="save-btn">
              Save
            </button>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>

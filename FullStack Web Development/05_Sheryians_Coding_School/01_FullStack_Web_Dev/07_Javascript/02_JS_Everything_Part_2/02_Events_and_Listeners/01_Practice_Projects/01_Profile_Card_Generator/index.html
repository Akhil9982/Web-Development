<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile card Generator</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #333;
      }
      input {
        display: block;
        color: slategray;
      }
      #main {
        padding: 30px;
        width: 100%;
        height: 100%;
      }
      .card {
        padding: 20px;
        border: 1px solid #555;
        display: inline-block;
        margin-top: 40px;
        border-radius: 10px;
        max-width: 300px;
        color: white;
      }

      .profile {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        margin-bottom: 7px;
        overflow: hidden;
      }
      .profile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .profile p {
        font-size: 12px;
        margin-top: 10px;
      }

      .card h5 {
        margin-top: 5px;
      }

      .card h3 {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="main">
      <form>
        <input type="text" placeholder="Profile Pic" />
        <input type="text" placeholder="Name" />
        <input type="text" placeholder="Occupation" />
        <input type="text" placeholder="Info" />
        <input type="submit" />
      </form>
    </div>
    <script src="script.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Directory Redesign</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-neutral-950 text-white min-h-screen flex flex-col items-center py-16 px-4 font-sans antialiased"
  >
    <div
      class="bg-neutral-900 border border-neutral-800 rounded-2xl p-8 w-full max-w-sm shadow-xl mb-16"
    >
      <h2 class="text-2xl font-bold text-center mb-6 tracking-wide">
        Add User
      </h2>
      <form id="addUserForm" class="space-y-4">
        <div class="flex flex-col gap-1.5">
          <label for="name" class="text-xs font-semibold text-neutral-300 ml-1"
            >Name</label
          >
          <input
            type="text"
            id="name"
            name="name"
            required
            class="w-full bg-neutral-800 border border-transparent rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-neutral-600 transition-colors"
          />
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="role" class="text-xs font-semibold text-neutral-300 ml-1"
            >Role</label
          >
          <input
            type="text"
            id="role"
            name="role"
            required
            class="w-full bg-neutral-800 border border-transparent rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-neutral-600 transition-colors"
          />
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="bio" class="text-xs font-semibold text-neutral-300 ml-1"
            >Bio</label
          >
          <textarea
            id="bio"
            name="bio"
            rows="3"
            required
            class="w-full bg-neutral-800 border border-transparent rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-neutral-600 transition-colors resize-none"
          ></textarea>
        </div>
        <div class="flex flex-col gap-1.5">
          <label
            for="photoUrl"
            class="text-xs font-semibold text-neutral-300 ml-1"
            >Photo URL</label
          >
          <input
            type="url"
            id="photoUrl"
            name="photoUrl"
            required
            class="w-full bg-neutral-800 border border-transparent rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-neutral-600 transition-colors"
          />
        </div>
        <div class="pt-2">
          <button
            type="submit"
            class="w-full bg-neutral-800/80 hover:bg-neutral-700 border border-neutral-700 text-sm text-white font-semibold py-3 rounded-lg transition duration-200"
          >
            Submit
          </button>
        </div>
      </form>
    </div>
    <div
      id="cardsContainer"
      class=" users flex flex-wrap justify-center gap-6 w-full max-w-5xl"
    >
    </div>
    <script src="script.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap Link -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <!-- Java Script Link -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="row d-flex justify-content-center">
        <div class="col-md-4">
          <div class="card">
            <img src="image1.png" class="card-img-top" alt="Image 1" />
            <div class="card-body">
              <h5 class="card-title">Card 1</h5>
              <p class="card-text">Description for Card 1</p>
              <button
                type="button"
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#cardModal1"
              >
                Open Modal
              </button>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card">
            <img src="image2.png" class="card-img-top" alt="Image 2" />
            <div class="card-body">
              <h5 class="card-title">Card 2</h5>
              <p class="card-text">Description for Card 2</p>
              <button type="button" class="btn btn-primary">Open Modal</button>
            </div>
          </div>
        </div>
      </div>

      <div
        class="modal fade"
        id="cardModal1"
        tabindex="-1"
        aria-labelledby="cardModalLabel1"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="cardModalLabel1">Card 1 Details</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">Details specific to Card 1.</div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-success"
                data-bs-dismiss="modal"
              >
                Close
              </button>
              <button type="button" class="btn btn-danger">Delete</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

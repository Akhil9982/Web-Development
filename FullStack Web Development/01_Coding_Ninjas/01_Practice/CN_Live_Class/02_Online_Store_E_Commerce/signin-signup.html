<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body id="login-page-body">
    <form>
        <input type="radio" name="form-input" id="signin-tab" checked>
        <label for="signin-tab">Sign In</label>
        <input type="radio" name="form-input" id="signup-tab">
        <label for="signup-tab">Sign Up</label>
        <div class="form signin-form">
            <h1>SignIn</h1>
            <input type="text" placeholder="email">
            <input type="password" name="" id="" placeholder="password">
            <button>Sign In</button>
            <label for="signup-tab" class="switch-link">
                Don't have an Account ?
            </label>
        </div>
        <div class="form signup-form">
            <h1>Sign Up</h1>
            <input type="text" placeholder="Full Name">
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">
            <input type="password" placeholder="Confirm Password">
            <button>Sign Up</button>
            <label for="signin-tab" class="switch-link">
                Already have an Account ?
            </label>
        </div>
    </form>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap Link -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <!-- Java Script Link -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
    <title>Forms</title>
  </head>
  <body>
    <div class="container pt-5">
      <form>
        <div class="form-floating">
          <input
            type="text"
            id="name"
            class="form-control mb-3"
            placeholder="Enter your name"
          />
          <label for="name" class="form-label">Name:</label>
        </div>

        <label for="color" class="form-label">Pick:</label>
        <input
          type="color"
          id="color"
          class="form-control form-control-color mb-3"
          placeholder="Enter your favorite color"
        />

        <label for="range" class="form-label">Pick a range:</label>
        <input
          type="range"
          id="range"
          class="form-range mb-3"
          placeholder="Enter your favorite range"
        />

        <select class="form-select">
          <option>Indian</option>
          <option>Non-Resident</option>
        </select>
        <div class="form-check form-switch">
          <input
            type="checkbox"
            id="checkbox"
            class="form-check-input mb-3"
            placeholder="Enter your favorite checkbox"
          />
          <label for="checkbox" class="form-check-label">Select</label>
        </div>

        <button class="btn btn-primary">Submit</button>
      </form>
    </div>
  </body>
</html>

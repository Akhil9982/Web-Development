<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer ></script>
</head>
<body>
    <section aria-label="Newest-Photos">
    <div class="carousel-container" data-carousel>
         <button id="prevButton" class="carousel-button" data-carousel-button = "prev">❮</button>
         <button id="nextButton" class="carousel-button" data-carousel-button = "next">❯</button>
        <img id="carouselImage" class="carousel-image" data-active src="media/img_1.avif" alt="Carousel Image_1">
        <img id="carouselImage" class="carousel-image" src="media/img_2.avif" alt="Carousel Image_2">
        <img id="carouselImage" class="carousel-image" src="media/img_3.avif" alt="Carousel Image_3">
    </div>
    </section>
</body>
</html>

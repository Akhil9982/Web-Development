<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Form</title>
</head>

<body>
    <h1>Please schedule your trip</h1>
    <form action="Success.html" method="post" autocomplete="on" target="_blank">
        <label for="username">Username</label>
        <input type="text" id="username" required size="30" name="username" placeholder="Your Name" />
        <br /><br />
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" maxlength="8" size="30" name="password" />
        <br /><br />
        <input type="file"  accept=".pdf,.doc,.docx" capture="user" id="fileInput" name="fileUpload" value="file" />
        <br><br>
        <input type="color" value="Prefered color" />
        <input type="submit" />
    </form>
</body>

</html>

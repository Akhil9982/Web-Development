<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Mandi - Login</title>
</head>
<body>
    <img src="../../Code_Mandi_HTML_Project/Multimedia/Code_Mandi.jpg" alt="Code Mandi" height="100" width="350" />

    <h1>Login Here</h1>
    <form>
        <fieldset>
            <legend>Login Information</legend>

            <!-- Username Input -->
            <label type="text">Username</label>
            <input type="text" id="name" name="username" required />
            <br /> <br />
            <!-- Password Input -->
             <label type="text">Passsword</label>
             <input type="password" id="password" name="password" required />
             <br /><br />
            <button type="submit">Login</button>
        </fieldset>
    </form>
</body>
</html>
